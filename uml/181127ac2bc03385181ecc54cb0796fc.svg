actor "통신 서브시스템" as COMM
actor "스케줄러" as SCH
actor "DAQ" as DAQ

GS - -> UC1
GS - -> UC2
GS - -> UC3
COMM - -> UC1
COMM - -> UC2
COMM - -> UC3
SCH - -> UC2
DAQ - -> UC3

@enduml

